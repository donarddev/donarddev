<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support Me</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 50px;
    }

    .box {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 15px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 20px rgba(255,255,255,0.08);
    }

    img {
      width: 250px;
      border-radius: 10px;
      margin-top: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    img:hover {
      transform: scale(1.03);
    }

    a {
      color: #4da3ff;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
      font-size: 14px;
    }

    button {
      margin-top: 15px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #43a047;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>☕ Support Me</h1>

    <p>Scan my GCash QR to support my work 💙</p>

    <!-- GCASH QR IMAGE -->
    <a href="gcash-qr.png" target="_blank">
      <img src="gcash-qr.png" alt="GCash QR">
    </a>

    <br>

    <a href="mailto:dolleno@nemsu.edu.ph?subject=Support%20Message&body=Hi%20I%20visited%20your%20support%20page">
      📩 Send Email
    </a>

    <br>

    <button onclick="alert('Thank you so much for your support! 💙')">
      Thank You
    </button>

  </div>

</body>
</html>
