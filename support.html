<!DOCTYPE html>
<html>
<head>
  <title>Support Me</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding: 50px;
    }

    .box {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 15px;
      max-width: 500px;
      margin: auto;
    }

    img {
      width: 250px;
      border-radius: 10px;
    }

    a {
      color: #4da3ff;
      text-decoration: none;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>☕ Support Me</h1>

    <p>Scan my GCash QR to support my work 💙</p>

    <!-- LOCAL IMAGE (inside repo) -->
    <img src="./gcash-qr.png" alt="GCash QR">

    <br><br>

    <a href="mailto:dolleno@nemsu.edu.ph?subject=Support&body=Hi I visited your support page">
      📩 Send Email
    </a>

    <br><br>

    <button onclick="alert('Thanks for your support! 💙')">
      Thank You
    </button>

  </div>

</body>
</html>
